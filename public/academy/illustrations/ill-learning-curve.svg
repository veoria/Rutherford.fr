<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="400" fill="#fff"/>
  <!-- axes -->
  <line x1="90" y1="300" x2="830" y2="300" stroke="#e8ecf0" stroke-width="2.5"/>
  <line x1="90" y1="300" x2="90" y2="70" stroke="#e8ecf0" stroke-width="2.5"/>
  <text x="60" y="80" font-size="10.5" fill="#9aa3ae" transform="rotate(-90 60 80)" text-anchor="end">gain vs generic CIP3</text>
  <!-- curve -->
  <path d="M90 296 C 200 280, 250 230, 340 200 S 560 130, 830 108" fill="none" stroke="#2563eb" stroke-width="4"/>
  <!-- milestones -->
  <g text-anchor="middle">
    <g transform="translate(90,300)"><circle r="6" fill="#111418"/><text y="24" font-size="12 " font-weight="700" fill="#111418">Day 0</text><text y="42" font-size="10.5" fill="#6b7480">cold start = vanilla</text><text y="56" font-size="10.5" fill="#6b7480">closed-loop</text></g>
    <g transform="translate(340,200)"><circle r="6" fill="#2563eb"/><text y="-38" font-size="12" font-weight="700" fill="#2563eb">30 days · 90–120 jobs</text><text y="-22" font-size="11" fill="#6b7480">+10–15% on familiar work</text></g>
    <g transform="translate(580,140)"><circle r="6" fill="#2563eb"/><text y="-38" font-size="12" font-weight="700" fill="#2563eb">90 days · 300+ jobs</text><text y="-22" font-size="11" fill="#6b7480">+20–25% — substrate quirks learned</text></g>
    <g transform="translate(810,108)"><circle r="6" fill="#16a34a"/><text y="-38" font-size="12" font-weight="700" fill="#14702f">1 year · ~700–900 jobs</text><text y="-22" font-size="11" fill="#6b7480">+25–35% — seasonal effects covered</text></g>
  </g>
  <!-- reset note -->
  <rect x="90" y="330" width="740" height="40" rx="10" fill="#fff7ed"/>
  <text x="460" y="355" font-size="13" font-weight="600" fill="#9a3412" text-anchor="middle">New press, substrate or ink supplier? Expect 30–60 days of degraded prediction while the model relearns.</text>
</svg>
