<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="400" fill="#fff"/>
  <g transform="translate(48,40)">
    <rect width="392" height="140" rx="16" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="24" y="36" font-size="13.5" font-weight="700" fill="#111418">1 · Drift</text>
    <polyline points="24,96 84,92 144,98 204,88 264,100 324,84 364,102" fill="none" stroke="#dc2626" stroke-width="3"/>
    <text x="24" y="126" font-size="11.5" fill="#6b7480">Fountains warm, blankets compress — 0.3 D over 10,000 sheets, invisible sheet-to-sheet</text>
  </g>
  <g transform="translate(460,40)">
    <rect width="392" height="140" rx="16" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="24" y="36" font-size="13.5" font-weight="700" fill="#111418">2 · Contamination</text>
    <g fill="#6b7480"><circle cx="60" cy="86" r="5"/><circle cx="92" cy="74" r="3.5"/><circle cx="120" cy="92" r="4.5"/><circle cx="150" cy="78" r="3"/></g>
    <rect x="190" y="68" width="160" height="30" rx="8" fill="#f4f6f8"/><text x="270" y="88" font-size="11" fill="#6b7480" text-anchor="middle">blanket residue · dust · dried ink</text>
    <text x="24" y="126" font-size="11.5" fill="#6b7480">The loop can detect it and alert — only a wash-up fixes it</text>
  </g>
  <g transform="translate(48,200)">
    <rect width="392" height="140" rx="16" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="24" y="36" font-size="13.5" font-weight="700" fill="#111418">3 · Fountain solution</text>
    <g font-size="10.5" font-weight="700" fill="#3c434b">
      <rect x="24" y="56" width="74" height="24" rx="12" fill="#f4f6f8"/><text x="61" y="72" text-anchor="middle">pH</text>
      <rect x="106" y="56" width="100" height="24" rx="12" fill="#f4f6f8"/><text x="156" y="72" text-anchor="middle">conductivity</text>
      <rect x="214" y="56" width="60" height="24" rx="12" fill="#f4f6f8"/><text x="244" y="72" text-anchor="middle">IPA %</text>
      <rect x="282" y="56" width="60" height="24" rx="12" fill="#f4f6f8"/><text x="312" y="72" text-anchor="middle">temp</text>
    </g>
    <text x="24" y="112" font-size="11.5" fill="#6b7480">Checked on Mondays… and Fridays look different. Color shifts with chemistry,</text>
    <text x="24" y="128" font-size="11.5" fill="#6b7480">even when the keys never moved</text>
  </g>
  <g transform="translate(460,200)">
    <rect width="392" height="140" rx="16" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="24" y="36" font-size="13.5" font-weight="700" fill="#111418">4 · Paper batch</text>
    <rect x="24" y="54" width="100" height="44" rx="6" fill="#fdfdfd" stroke="#c8d0d9"/><text x="74" y="80" font-size="10.5" fill="#6b7480" text-anchor="middle">pallet A</text>
    <rect x="136" y="54" width="100" height="44" rx="6" fill="#fbf7ec" stroke="#c8d0d9"/><text x="186" y="80" font-size="10.5" fill="#6b7480" text-anchor="middle">pallet B ≠</text>
    <text x="24" y="120" font-size="11.5" fill="#6b7480">Same nominal grade, different gloss / absorption / OBA load —</text>
    <text x="24" y="136" font-size="11.5" fill="#6b7480">measure the paper before the run</text>
  </g>
  <rect x="48" y="356" width="804" height="36" rx="10" fill="#fdeaea"/>
  <text x="450" y="379" font-size="13" font-weight="700" fill="#b33" text-anchor="middle">The loop separates "an ink key can fix this" from "something else is going on" — that's half its value</text>
</svg>
