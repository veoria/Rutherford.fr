<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>

  <!-- left: CMY building gray -->
  <g transform="translate(60,52)">
    <rect width="380" height="270" rx="16" fill="#ffffff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="190" y="36" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#9aa3ae" text-anchor="middle">THE G7 ANCHOR</text>
    <!-- C M Y patches -->
    <g transform="translate(50,60)">
      <rect width="64" height="48" rx="8" fill="#00b3d6"/>
      <rect x="74" width="64" height="48" rx="8" fill="#e6007e"/>
      <rect x="148" width="64" height="48" rx="8" fill="#ffd200"/>
      <text x="236" y="30" font-size="22" font-weight="700" fill="#9aa3ae">=</text>
      <rect x="256" width="64" height="48" rx="8" fill="#8a8f95"/>
    </g>
    <text x="190" y="150" font-size="13.5" font-weight="700" fill="#111418" text-anchor="middle">If CMY grays neutralize…</text>
    <text x="190" y="172" font-size="12.5" fill="#6b7480" text-anchor="middle">…and the neutral print density curve matches</text>
    <text x="190" y="190" font-size="12.5" fill="#6b7480" text-anchor="middle">the target, the rest of the gamut follows.</text>
    <rect x="50" y="212" width="280" height="36" rx="10" fill="#e9f7ef"/>
    <text x="190" y="235" font-size="12.5" font-weight="700" fill="#14702f" text-anchor="middle">Gray balance = the most visible failure mode</text>
  </g>

  <!-- right: process agnostic -->
  <g transform="translate(480,52)">
    <rect width="360" height="270" rx="16" fill="#ffffff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="180" y="36" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#9aa3ae" text-anchor="middle">PROCESS-AGNOSTIC</text>
    <g font-size="13" font-weight="600" fill="#3c434b">
      <rect x="40" y="60" width="280" height="38" rx="10" fill="#f4f6f8"/><text x="180" y="84" text-anchor="middle">🟢 Offset — sheetfed &amp; web</text>
      <rect x="40" y="108" width="280" height="38" rx="10" fill="#f4f6f8"/><text x="180" y="132" text-anchor="middle">🟦 Flexo</text>
      <rect x="40" y="156" width="280" height="38" rx="10" fill="#f4f6f8"/><text x="180" y="180" text-anchor="middle">🟪 Digital — toner &amp; inkjet</text>
    </g>
    <text x="180" y="228" font-size="12.5" fill="#6b7480" text-anchor="middle">One calibration methodology,</text>
    <text x="180" y="246" font-size="12.5" fill="#6b7480" text-anchor="middle">any printing process</text>
  </g>

  <!-- bottom -->
  <rect x="60" y="344" width="780" height="40" rx="10" fill="#f4f6f8"/>
  <text x="450" y="369" font-size="14" font-weight="600" fill="#111418" text-anchor="middle">G7 calibrates with gray balance — measured unpolarized, ISO 13655 M1</text>
</svg>
