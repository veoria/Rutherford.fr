  <g text-anchor="middle">
    <g transform="translate(250,120)"><rect x="-90" y="-44" width="180" height="88" rx="14" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/><text y="-12" font-size="13.5" font-weight="700" fill="#111418">1 · Observe</text><text y="10" font-size="11" fill="#6b7480">weekly dashboard scan —</text><text y="25" font-size="11" fill="#6b7480">flag what trends wrong</text></g>
    <g transform="translate(650,120)"><rect x="-90" y="-44" width="180" height="88" rx="14" fill="#fff" stroke="#9b59ff" stroke-width="2"/><text y="-12" font-size="13.5" font-weight="700" fill="#111418">2 · Hypothesize</text><text y="10" font-size="11" fill="#6b7480">drill down + a falsifiable</text><text y="25" font-size="11" fill="#6b7480">prediction: ΔE &lt; 1.5 in 4 wks</text></g>
    <g transform="translate(650,330)"><rect x="-90" y="-44" width="180" height="88" rx="14" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/><text y="-12" font-size="13.5" font-weight="700" fill="#111418">3 · Act</text><text y="10" font-size="11" fill="#6b7480">maintenance, training,</text><text y="25" font-size="11" fill="#6b7480">tolerance or substrate change</text></g>
    <g transform="translate(250,330)"><rect x="-90" y="-44" width="180" height="88" rx="14" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/><text y="-12" font-size="13.5" font-weight="700" fill="#111418">4 · Verify</text><text y="10" font-size="11" fill="#6b7480">next month's dashboard:</text><text y="25" font-size="11" fill="#6b7480">prediction held — or revise</text></g>
