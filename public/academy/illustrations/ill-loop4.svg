  <rect x="60" y="386" width="780" height="0" fill="none"/>
  <text x="450" y="404" font-size="13" font-weight="600" fill="#111418" text-anchor="middle">A pressroom that runs this loop monthly outperforms one that doesn't — with identical equipment</text>
