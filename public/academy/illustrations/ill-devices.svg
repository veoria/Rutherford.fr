<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="400" fill="#fff"/>
  <!-- Handheld -->
  <g transform="translate(48,44)">
    <rect width="252" height="280" rx="16" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="126" y="34" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#9aa3ae" text-anchor="middle">HANDHELD</text>
    <g transform="translate(96,56)"><rect width="60" height="90" rx="14" fill="#111418"/><circle cx="30" cy="70" r="12" fill="#2563eb"/><rect x="18" y="14" width="24" height="30" rx="4" fill="#3c434b"/></g>
    <text x="126" y="180" font-size="13.5" font-weight="700" fill="#111418" text-anchor="middle">Single patch · mobile</text>
    <text x="126" y="204" font-size="12" fill="#6b7480" text-anchor="middle">e.g. eXact 2 — spot checks,</text>
    <text x="126" y="221" font-size="12" fill="#6b7480" text-anchor="middle">customer-site verification</text>
    <rect x="36" y="238" width="180" height="26" rx="13" fill="#f4f6f8"/>
    <text x="126" y="255" font-size="11" font-weight="700" fill="#6b7480" text-anchor="middle">LOW VOLUME</text>
  </g>
  <!-- Scanning -->
  <g transform="translate(324,32)">
    <rect width="252" height="304" rx="16" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="66" y="-12" width="120" height="24" rx="12" fill="#2563eb"/>
    <text x="126" y="5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">PRESS-SIDE STANDARD</text>
    <text x="126" y="44" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#2563eb" text-anchor="middle">AUTOMATED SCANNING</text>
    <g transform="translate(36,64)"><rect width="180" height="14" rx="7" fill="#c8d0d9"/><rect x="60" y="-14" width="36" height="26" rx="6" fill="#111418"/><rect y="22" width="180" height="56" rx="6" fill="#f4f6f8" stroke="#e8ecf0"/><rect x="10" y="64" width="160" height="7" rx="3.5" fill="#00b3d6"/></g>
    <text x="126" y="186" font-size="13.5" font-weight="700" fill="#111418" text-anchor="middle">Semi-automatic · off-press</text>
    <text x="126" y="210" font-size="12" fill="#6b7480" text-anchor="middle">IntelliTrax2 — operator pulls a sheet,</text>
    <text x="126" y="227" font-size="12" fill="#6b7480" text-anchor="middle">the head scans the full bar in seconds</text>
    <rect x="36" y="248" width="180" height="26" rx="13" fill="#eaf1fe"/>
    <text x="126" y="265" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">MULTI-JOB SHIFTS · CLOSED-LOOP</text>
  </g>
  <!-- Inline -->
  <g transform="translate(600,44)">
    <rect width="252" height="280" rx="16" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="126" y="34" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#9aa3ae" text-anchor="middle">TRUE INLINE</text>
    <g transform="translate(46,60)"><rect width="160" height="70" rx="10" fill="#111418"/><circle cx="40" cy="35" r="16" fill="#3c434b"/><circle cx="80" cy="35" r="16" fill="#3c434b"/><circle cx="120" cy="35" r="16" fill="#3c434b"/><rect x="28" y="-12" width="104" height="14" rx="7" fill="#2563eb"/></g>
    <text x="126" y="180" font-size="13.5" font-weight="700" fill="#111418" text-anchor="middle">In-press · continuous</text>
    <text x="126" y="204" font-size="12" fill="#6b7480" text-anchor="middle">Cameras/spectros inside the press —</text>
    <text x="126" y="221" font-size="12" fill="#6b7480" text-anchor="middle">a separate device class entirely</text>
    <rect x="36" y="238" width="180" height="26" rx="13" fill="#f4f6f8"/>
    <text x="126" y="255" font-size="11" font-weight="700" fill="#6b7480" text-anchor="middle">EVERY SHEET · HIGHER CAPEX</text>
  </g>
  <rect x="48" y="352" width="804" height="36" rx="10" fill="#f4f6f8"/>
  <text x="450" y="375" font-size="13.5" font-weight="600" fill="#111418" text-anchor="middle">Not "which is best" — which fits your volume and your tolerance. Most real shops own two classes.</text>
</svg>
