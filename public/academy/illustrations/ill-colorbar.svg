<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="420" fill="#fff"/>
  <!-- press sheet -->
  <g transform="translate(90,46)">
    <rect width="720" height="250" rx="10" fill="#fdfdfd" stroke="#c8d0d9" stroke-width="2"/>
    <text x="360" y="110" font-size="13" fill="#c8d0d9" text-anchor="middle">live image area</text>
    <!-- varnish overlay -->
    <rect x="0" y="0" width="720" height="196" rx="10" fill="#7c3aed" opacity=".06"/>
    <text x="652" y="26" font-size="11" font-weight="700" fill="#7c3aed" opacity=".7">UV varnish</text>
    <!-- knockout strip -->
    <rect x="14" y="200" width="692" height="36" fill="#fff" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="360" y="194" font-size="11" font-weight="700" fill="#14702f" text-anchor="middle">varnish knockout — the bar stays bare</text>
    <!-- color bar patches across full width -->
    <g transform="translate(22,206)">
      <g>
        <rect width="20" height="24" fill="#00b3d6"/><rect x="22" width="20" height="24" fill="#e6007e"/><rect x="44" width="20" height="24" fill="#ffd200"/><rect x="66" width="20" height="24" fill="#111418"/>
        <rect x="88" width="20" height="24" fill="#8a8f95"/><rect x="110" width="20" height="24" fill="#5fcde4"/><rect x="132" width="20" height="24" fill="#f06eb1"/><rect x="154" width="20" height="24" fill="#ffe566"/>
      </g>
      <use href="#g0"/>
      <g transform="translate(176)"><rect width="20" height="24" fill="#00b3d6"/><rect x="22" width="20" height="24" fill="#e6007e"/><rect x="44" width="20" height="24" fill="#ffd200"/><rect x="66" width="20" height="24" fill="#111418"/><rect x="88" width="20" height="24" fill="#8a8f95"/><rect x="110" width="20" height="24" fill="#5fcde4"/><rect x="132" width="20" height="24" fill="#f06eb1"/><rect x="154" width="20" height="24" fill="#ffe566"/></g>
      <g transform="translate(352)"><rect width="20" height="24" fill="#00b3d6"/><rect x="22" width="20" height="24" fill="#e6007e"/><rect x="44" width="20" height="24" fill="#ffd200"/><rect x="66" width="20" height="24" fill="#111418"/><rect x="88" width="20" height="24" fill="#8a8f95"/><rect x="110" width="20" height="24" fill="#5fcde4"/><rect x="132" width="20" height="24" fill="#f06eb1"/><rect x="154" width="20" height="24" fill="#ffe566"/></g>
      <g transform="translate(528)"><rect width="20" height="24" fill="#00b3d6"/><rect x="22" width="20" height="24" fill="#e6007e"/><rect x="44" width="20" height="24" fill="#ffd200"/><rect x="66" width="20" height="24" fill="#111418"/><rect x="88" width="20" height="24" fill="#8a8f95"/><rect x="110" width="20" height="24" fill="#5fcde4"/><rect x="132" width="20" height="24" fill="#f06eb1"/></g>
    </g>
  </g>
  <!-- ink zones below -->
  <g transform="translate(90,312)">
    <g stroke="#c8d0d9" stroke-width="1.5">
      <line x1="0" y1="0" x2="0" y2="14"/><line x1="90" y1="0" x2="90" y2="14"/><line x1="180" y1="0" x2="180" y2="14"/><line x1="270" y1="0" x2="270" y2="14"/><line x1="360" y1="0" x2="360" y2="14"/><line x1="450" y1="0" x2="450" y2="14"/><line x1="540" y1="0" x2="540" y2="14"/><line x1="630" y1="0" x2="630" y2="14"/><line x1="720" y1="0" x2="720" y2="14"/>
    </g>
    <text x="360" y="32" font-size="11.5" fill="#6b7480" text-anchor="middle">one patch group per ink zone (zone pitch ≈ 30–38 mm by OEM) — the bar spans the full live width</text>
  </g>
  <!-- edge constraint -->
  <g transform="translate(820,252)">
    <path d="M0 0 V40" stroke="#dc2626" stroke-width="2.5"/>
    <path d="M-8 20 H-30" stroke="#dc2626" stroke-width="2.5" marker-end="none"/>
    <text x="14" y="14" font-size="10.5" font-weight="700" fill="#dc2626" transform="rotate(90 14 14)">≤ 38 mm</text>
  </g>
  <rect x="90" y="364" width="720" height="36" rx="10" fill="#f4f6f8"/>
  <text x="450" y="387" font-size="13" font-weight="600" fill="#111418" text-anchor="middle">Two prepress decisions: bar ≤ 38 mm from the edge (scanner reach) + varnish knockout over the bar</text>
</svg>
