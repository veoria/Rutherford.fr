<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>

  <!-- concentric tolerance rings -->
  <g transform="translate(280,180)">
    <circle r="130" fill="#f4f6f8" stroke="#c8d0d9" stroke-width="2" stroke-dasharray="7 6"/>
    <circle r="84" fill="#eaf1fe" stroke="#2563eb" stroke-width="2.5"/>
    <circle r="44" fill="#e9f7ef" stroke="#16a34a" stroke-width="2.5"/>
    <circle r="7" fill="#111418"/>
    <text x="0" y="-142" font-size="12" font-weight="700" fill="#6b7480" text-anchor="middle">ISO 12647 tolerance — the FLOOR</text>
    <text x="0" y="-96" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">Brand-owner spec — tighter</text>
    <text x="0" y="-54" font-size="11.5" font-weight="700" fill="#14702f" text-anchor="middle">Your production target</text>
    <text x="0" y="24" font-size="10.5" fill="#6b7480" text-anchor="middle">aim</text>
  </g>

  <!-- right: the rule -->
  <g transform="translate(520,86)">
    <rect width="332" height="210 " rx="16" fill="#ffffff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="28" y="42" font-size="14.5" font-weight="700" fill="#111418">Plan for the floor, aim higher</text>
    <g font-size="13" fill="#3c434b">
      <text x="28" y="78">• ISO sets the <tspan font-weight="700">minimum</tspan> everyone accepts</text>
      <text x="28" y="108">• Brand specs now sit <tspan font-weight="700">tighter</tspan> than ISO</text>
      <text x="28" y="138">• Production targets sit tighter still —</text>
      <text x="40" y="158">the buffer absorbs drift &amp; instrument gaps</text>
    </g>
    <rect x="28" y="172" width="276" height="2" fill="#e8ecf0"/>
    <text x="28" y="196" font-size="12" fill="#9a3412" font-weight="600">Treating ISO as the destination = built-in rejects</text>
  </g>

  <!-- bottom band -->
  <rect x="48" y="328" width="804" height="40" rx="10" fill="#f4f6f8"/>
  <text x="450" y="353" font-size="14" font-weight="600" fill="#111418" text-anchor="middle">Deviation from the standard must be a deliberate choice — never an accident</text>
</svg>
