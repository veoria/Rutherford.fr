<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="380" fill="#fff"/>
  <!-- repeatability -->
  <g transform="translate(48,44)">
    <rect width="380" height="250" rx="16" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="190" y="34" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#14702f" text-anchor="middle">REPEATABILITY — one instrument</text>
    <circle cx="190" cy="130" r="62" fill="none" stroke="#e8ecf0" stroke-width="2"/>
    <circle cx="190" cy="130" r="26" fill="#e9f7ef" stroke="#16a34a" stroke-width="2"/>
    <g fill="#16a34a"><circle cx="186" cy="126" r="4"/><circle cx="195" cy="133" r="4"/><circle cx="189" cy="137" r="4"/><circle cx="194" cy="124" r="4"/><circle cx="184" cy="133" r="4"/></g>
    <text x="190" y="222" font-size="13" font-weight="700" fill="#111418" text-anchor="middle">≈ 0.05–0.15 ΔE on white</text>
    <text x="190" y="240" font-size="11.5" fill="#6b7480" text-anchor="middle">same device, same sample, same operator</text>
  </g>
  <!-- reproducibility -->
  <g transform="translate(472,44)">
    <rect width="380" height="250" rx="16" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="190" y="34" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#9a3412" text-anchor="middle">REPRODUCIBILITY — across instruments</text>
    <circle cx="190" cy="130" r="62" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <g fill="#f59e0b"><circle cx="160" cy="110" r="4"/><circle cx="220" cy="150" r="4"/><circle cx="206" cy="100" r="4"/><circle cx="168" cy="156" r="4"/><circle cx="232" cy="122" r="4"/><circle cx="148" cy="136" r="4"/></g>
    <text x="190" y="222" font-size="13" font-weight="700" fill="#111418" text-anchor="middle">IIA ≈ 0.3 avg / 0.45 max ΔE</text>
    <text x="190" y="240" font-size="11.5" fill="#6b7480" text-anchor="middle">always worse — different devices, operators, temps</text>
  </g>
  <rect x="48" y="318" width="804" height="44" rx="10" fill="#f4f6f8"/>
  <text x="450" y="338" font-size="13" font-weight="600" fill="#111418" text-anchor="middle">The brand owner's lab will never read exactly your number — designate a reference instrument per customer,</text>
  <text x="450" y="355" font-size="13" font-weight="600" fill="#111418" text-anchor="middle">document the offsets, recertify every device annually.</text>
</svg>
