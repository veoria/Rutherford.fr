<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- family header -->
  <rect x="330" y="28" width="240" height="52" rx="12" fill="#111418"/>
  <text x="450" y="50" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ISO 12647</text>
  <text x="450" y="68" font-size="11" fill="#aeb6bf" text-anchor="middle">process control for printing</text>

  <g stroke="#c8d0d9" stroke-width="2.5" fill="none">
    <path d="M450 80 V 104 M450 104 H 170 V 126 M450 104 H 730 V 126 M450 104 V 126"/>
  </g>

  <!-- -3 -->
  <g transform="translate(70,134)">
    <rect width="200" height="92" rx="14" fill="#f4f6f8" stroke="#e8ecf0"/>
    <text x="100" y="34" font-size="15" font-weight="700" fill="#9aa3ae" text-anchor="middle">12647-3</text>
    <text x="100" y="56" font-size="12" fill="#6b7480" text-anchor="middle">Newsprint</text>
    <text x="100" y="74" font-size="12" fill="#6b7480" text-anchor="middle">(coldset web)</text>
  </g>

  <!-- -2 highlighted -->
  <g transform="translate(330,126)">
    <rect width="240" height="110" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="120" y="34" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">12647-2</text>
    <text x="120" y="58" font-size="12.5" font-weight="600" fill="#111418" text-anchor="middle">Sheetfed offset</text>
    <text x="120" y="78" font-size="11.5" fill="#6b7480" text-anchor="middle">The part brand owners cite</text>
    <text x="120" y="94" font-size="11.5" fill="#6b7480" text-anchor="middle">for packaging specs</text>
  </g>

  <!-- -6 -->
  <g transform="translate(630,134)">
    <rect width="200" height="92" rx="14" fill="#f4f6f8" stroke="#e8ecf0"/>
    <text x="100" y="34" font-size="15" font-weight="700" fill="#9aa3ae" text-anchor="middle">12647-6</text>
    <text x="100" y="56" font-size="12" fill="#6b7480" text-anchor="middle">Flexo</text>
  </g>

  <!-- what -2 defines: 3 chips -->
  <g transform="translate(70,272)">
    <rect width="232" height="104" rx="14" fill="#ffffff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="116" y="30" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#2563eb" text-anchor="middle">SUBSTRATE CLASSES</text>
    <g font-size="10.5" font-weight="700" fill="#3c434b">
      <rect x="18" y="44" width="44" height="22" rx="11" fill="#f4f6f8"/><text x="40" y="59" text-anchor="middle">PS1</text>
      <rect x="68" y="44" width="44" height="22" rx="11" fill="#f4f6f8"/><text x="90" y="59" text-anchor="middle">PS2</text>
      <rect x="118" y="44" width="44" height="22" rx="11" fill="#f4f6f8"/><text x="140" y="59" text-anchor="middle">…</text>
      <rect x="168" y="44" width="44" height="22" rx="11" fill="#f4f6f8"/><text x="190" y="59" text-anchor="middle">PS8</text>
    </g>
    <text x="116" y="90" font-size="10.5" fill="#9aa3ae" text-anchor="middle">2013 edition (was PT1–PT5 in 2004)</text>
  </g>
  <g transform="translate(334,272)">
    <rect width="232" height="104" rx="14" fill="#ffffff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="116" y="30" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#2563eb" text-anchor="middle">TVI CURVES</text>
    <path d="M40 88 Q 116 30 192 88" fill="none" stroke="#00b3d6" stroke-width="3"/>
    <line x1="40" y1="88" x2="192" y2="88" stroke="#e8ecf0" stroke-width="2"/>
    <text x="116" y="100" font-size="10.5" fill="#9aa3ae" text-anchor="middle"> </text>
  </g>
  <g transform="translate(598,272)">
    <rect width="232" height="104" rx="14" fill="#ffffff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="116" y="30" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#2563eb" text-anchor="middle">CIELAB AIM POINTS</text>
    <g transform="translate(48,44)">
      <rect width="30" height="30" rx="6" fill="#00b3d6"/><rect x="36" width="30" height="30" rx="6" fill="#e6007e"/>
      <rect x="72" width="30" height="30" rx="6" fill="#ffd200"/><rect x="108" width="30" height="30" rx="6" fill="#111418"/>
    </g>
    <text x="116" y="96" font-size="10.5" fill="#9aa3ae" text-anchor="middle">per substrate class</text>
  </g>
</svg>
