<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="410" fill="#ffffff"/>

  <!-- LEFT: operator approves -->
  <g transform="translate(48,36)">
    <rect width="380" height="270" rx="16" fill="#ffffff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="190" y="36" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#9aa3ae" text-anchor="middle">"OPERATOR APPROVES"</text>
    <!-- axis -->
    <line x1="40" y1="200" x2="340" y2="200" stroke="#e8ecf0" stroke-width="2"/>
    <line x1="40" y1="120" x2="340" y2="120" stroke="#c8d0d9" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="44" y="112" font-size="10" fill="#9aa3ae">target</text>
    <!-- jagged line -->
    <polyline points="40,150 80,95 120,170 160,110 200,185 240,90 280,160 320,105" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/>
    <g font-size="14" fill="#dc2626" font-weight="700">
      <text x="76" y="84">?</text><text x="196" y="206">?</text><text x="236" y="79">?</text>
    </g>
    <text x="190" y="236" font-size="12" fill="#6b7480" text-anchor="middle">Every shift redefines "good" —</text>
    <text x="190" y="252" font-size="12" fill="#6b7480" text-anchor="middle">no record, no defense, no learning</text>
  </g>

  <!-- arrow -->
  <g transform="translate(438,160)">
    <path d="M0 0 H20" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    <path d="M22 0 l-12 -8 v16 z" fill="#16a34a"/>
  </g>

  <!-- RIGHT: device measures -->
  <g transform="translate(472,36)">
    <rect width="380" height="270" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="190" y="36" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#14702f" text-anchor="middle">"DEVICE MEASURES"</text>
    <!-- tolerance band -->
    <rect x="40" y="100" width="300" height="40" rx="8" fill="#e9f7ef"/>
    <line x1="40" y1="120" x2="340" y2="120" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="44" y="96" font-size="10" fill="#14702f">tolerance band · ΔE00 &lt; 2.0</text>
    <!-- tight line -->
    <polyline points="40,124 80,114 120,126 160,116 200,122 240,112 280,124 320,118" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round"/>
    <!-- data trail chips -->
    <g font-size="10.5" font-weight="600">
      <rect x="40" y="160" width="86" height="22" rx="11" fill="#f4f6f8"/><text x="83" y="175" fill="#3c434b" text-anchor="middle">job ID ✓</text>
      <rect x="134" y="160" width="86" height="22" rx="11" fill="#f4f6f8"/><text x="177" y="175" fill="#3c434b" text-anchor="middle">operator ✓</text>
      <rect x="228" y="160" width="112" height="22" rx="11" fill="#f4f6f8"/><text x="284" y="175" fill="#3c434b" text-anchor="middle">timestamp + ΔE ✓</text>
    </g>
    <text x="190" y="236" font-size="12" fill="#6b7480" text-anchor="middle">Same verdict every shift —</text>
    <text x="190" y="252" font-size="12" fill="#6b7480" text-anchor="middle">and a record you can show the brand owner</text>
  </g>

  <!-- bottom band -->
  <rect x="48" y="336" width="804" height="44" rx="10" fill="#f4f6f8"/>
  <text x="450" y="363" font-size="14" font-weight="600" fill="#111418" text-anchor="middle">The payoff: defend it · audit it · repeat it · improve it</text>
</svg>
