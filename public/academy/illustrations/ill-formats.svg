<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="420" fill="#fff"/>
  <text x="450" y="44" font-size="13" font-weight="700" letter-spacing="1.5" fill="#9aa3ae" text-anchor="middle">CHOOSE THE FORMAT BY THE RECEIVER, NOT THE SENDER</text>
  <!-- PQX -->
  <g transform="translate(48,70)">
    <rect width="258" height="150" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="22" y="36" font-size="16" font-weight="700" fill="#2563eb">PQX</text>
    <text x="22" y="56" font-size="10.5" font-weight="700" fill="#9aa3ae">ISO 20616-1 · OPEN</text>
    <text x="22" y="84" font-size="12" fill="#3c434b">→ Brand-owner reporting</text>
    <text x="22" y="104" font-size="11.5" fill="#6b7480">Values + measurement conditions,</text>
    <text x="22" y="120" font-size="11.5" fill="#6b7480">vendor-neutral, machine-readable</text>
  </g>
  <!-- CXF -->
  <g transform="translate(322,70)">
    <rect width="258" height="150" rx="14" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="22" y="36" font-size="16" font-weight="700" fill="#111418">CXF</text>
    <text x="22" y="56" font-size="10.5" font-weight="700" fill="#9aa3ae">ISO 17972</text>
    <text x="22" y="84" font-size="12" fill="#3c434b">→ Spectral data exchange</text>
    <text x="22" y="104" font-size="11.5" fill="#6b7480">Full reflectance curves — prepress</text>
    <text x="22" y="120" font-size="11.5" fill="#6b7480">tools &amp; brand color-science teams</text>
  </g>
  <!-- MIF -->
  <g transform="translate(596,70)">
    <rect width="258" height="150" rx="14" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="22" y="36" font-size="16" font-weight="700" fill="#111418">MIF</text>
    <text x="22" y="56" font-size="10.5" font-weight="700" fill="#9aa3ae">MEASURECOLOR NATIVE ⚠ à confirmer</text>
    <text x="22" y="84" font-size="12" fill="#3c434b">→ Internal data movement</text>
    <text x="22" y="104" font-size="11.5" fill="#6b7480">Full job context: templates,</text>
    <text x="22" y="120" font-size="11.5" fill="#6b7480">tolerances, metadata</text>
  </g>
  <!-- ICC -->
  <g transform="translate(185,240)">
    <rect width="258" height="150" rx="14" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="22" y="36" font-size="16" font-weight="700" fill="#111418">ICC</text>
    <text x="22" y="56" font-size="10.5" font-weight="700" fill="#9aa3ae">PROFILES</text>
    <text x="22" y="84" font-size="12" fill="#3c434b">→ Characterization &amp; soft-proofing</text>
    <text x="22" y="104" font-size="11.5" fill="#b33" font-weight="600">NOT a per-sheet measurement —</text>
    <text x="22" y="120" font-size="11.5" fill="#6b7480">describes a process in general</text>
  </g>
  <!-- CGATS -->
  <g transform="translate(459,240)">
    <rect width="258" height="150" rx="14" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="22" y="36" font-size="16" font-weight="700" fill="#111418">CGATS.17</text>
    <text x="22" y="56" font-size="10.5" font-weight="700" fill="#9aa3ae">TEXT · LEGACY WORKHORSE</text>
    <text x="22" y="84" font-size="12" fill="#3c434b">→ Round-tripping &amp; old integrations</text>
    <text x="22" y="104" font-size="11.5" fill="#6b7480">Human-readable, universally</text>
    <text x="22" y="120" font-size="11.5" fill="#6b7480">supported — the CSV of color</text>
  </g>
</svg>
