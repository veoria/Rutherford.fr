<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
  <rect width="960" height="590" fill="#ffffff"/>

  <text x="48" y="56" font-size="13" font-weight="700" letter-spacing="2.2" fill="#2563eb">THE COST OF A MAKEREADY · B1 6-COLOR</text>
  <text x="48" y="92" font-size="28" font-weight="700" fill="#111418">Where the €470 goes — and what closed-loop recovers</text>
  <text x="48" y="118" font-size="14.5" fill="#6b7480">Baseline: 800 sheets to first good copy (250 g/m² at €1,200/t ≈ €0.21/sheet) + 120 min press time at €150/h.</text>

  <!-- ===== left: stacked bar baseline ===== -->
  <g transform="translate(120,170)">
    <text x="70" y="-12" font-size="13" font-weight="700" fill="#111418" text-anchor="middle">Without closed-loop</text>
    <!-- press time block (300) -->
    <rect x="0" y="0" width="140" height="174" rx="10" fill="#111418"/>
    <text x="70" y="78" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Press time</text>
    <text x="70" y="100" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">€300</text>
    <text x="70" y="120" font-size="11.5" fill="#aeb6bf" text-anchor="middle">120 min · €150/h</text>
    <!-- paper block (170) -->
    <rect x="0" y="180" width="140" height="100" rx="10" fill="#2563eb"/>
    <text x="70" y="222" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Paper waste</text>
    <text x="70" y="244" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">€170</text>
    <text x="70" y="263" font-size="11.5" fill="#cfe0fb" text-anchor="middle">800 sheets</text>
    <!-- total -->
    <text x="70" y="312" font-size="16" font-weight="700" fill="#111418" text-anchor="middle">≈ €470</text>
    <text x="70" y="332" font-size="12" fill="#6b7480" text-anchor="middle">per makeready</text>
  </g>

  <!-- arrow -->
  <g transform="translate(330,300)">
    <path d="M0 0 H96" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    <path d="M96 0 l-14 -9 v18 z" fill="#16a34a"/>
    <text x="48" y="-16" font-size="12.5" font-weight="700" fill="#14702f" text-anchor="middle">−30–55% waste</text>
    <text x="48" y="28" font-size="12.5" font-weight="700" fill="#14702f" text-anchor="middle">−25–40% time</text>
  </g>

  <!-- ===== middle: bar with closed-loop ===== -->
  <g transform="translate(470,170)">
    <text x="70" y="-12" font-size="13" font-weight="700" fill="#111418" text-anchor="middle">With closed-loop</text>
    <!-- ghost of old total -->
    <rect x="0" y="0" width="140" height="280" rx="10" fill="none" stroke="#e8ecf0" stroke-dasharray="6 5"/>
    <!-- press time reduced (~190) -->
    <rect x="0" y="100" width="140" height="108" rx="10" fill="#111418"/>
    <text x="70" y="148" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Press time ≈ €190</text>
    <text x="70" y="168" font-size="11.5" fill="#aeb6bf" text-anchor="middle">75–85 min</text>
    <!-- paper reduced (~85) -->
    <rect x="0" y="214" width="140" height="66" rx="10" fill="#2563eb"/>
    <text x="70" y="242" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Paper ≈ €85</text>
    <text x="70" y="260" font-size="11.5" fill="#cfe0fb" text-anchor="middle">350–450 sheets</text>
    <text x="70" y="312" font-size="16" font-weight="700" fill="#14702f" text-anchor="middle">≈ €275</text>
    <text x="70" y="332" font-size="12" fill="#6b7480" text-anchor="middle">per makeready</text>
  </g>

  <!-- ===== right: annualized card ===== -->
  <g transform="translate(700,170)">
    <rect width="212" height="280" rx="16" fill="#f4f6f8" stroke="#e8ecf0"/>
    <text x="106" y="36" font-size="12" font-weight="700" letter-spacing="1.5" fill="#9aa3ae" text-anchor="middle">× 675 MAKEREADIES / YEAR</text>
    <text x="106" y="86" font-size="26" font-weight="700" fill="#14702f" text-anchor="middle">≈ €140k</text>
    <text x="106" y="108" font-size="12.5" fill="#6b7480" text-anchor="middle">recovered per press per year</text>
    <line x1="24" y1="130" x2="188" y2="130" stroke="#e8ecf0"/>
    <rect x="32" y="148" width="11" height="11" rx="3" fill="#2563eb"/>
    <text x="52" y="158" font-size="13" fill="#111418">Paper saved</text>
    <text x="178" y="158" font-size="13" font-weight="700" fill="#111418" text-anchor="end">≈ €63k</text>
    <rect x="32" y="176" width="11" height="11" rx="3" fill="#111418"/>
    <text x="52" y="186" font-size="13" fill="#111418">Press time</text>
    <text x="178" y="186" font-size="13" font-weight="700" fill="#111418" text-anchor="end">≈ €77k</text>
    <line x1="24" y1="206" x2="188" y2="206" stroke="#e8ecf0"/>
    <text x="34" y="232" font-size="11.5" fill="#6b7480">+ fewer brand-owner rejects,</text>
    <text x="34" y="248" font-size="11.5" fill="#6b7480">audit-ready data trail</text>
    <text x="34" y="268" font-size="10.5" fill="#9aa3ae">Figures to validate on real installs</text>
  </g>

  <!-- footer -->
  <rect x="48" y="530" width="864" height="40" rx="10" fill="#f4f6f8"/>
  <text x="480" y="555" font-size="14" font-weight="600" fill="#111418" text-anchor="middle">3 makereadies/day · 225 days/year — the press is not earning while it is being set up</text>
</svg>
