<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="380" fill="#fff"/>
  <defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker></defs>
  <!-- capture -->
  <g transform="translate(48,60)">
    <rect width="220" height="120" rx="14" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="110" y="32" font-size="11" font-weight="700" letter-spacing="1.2" fill="#9aa3ae" text-anchor="middle">1 · CAPTURE — AT THE PRESS</text>
    <text x="110" y="60" font-size="12.5" font-weight="700" fill="#111418" text-anchor="middle">Every measurement, tagged</text>
    <text x="110" y="82" font-size="11" fill="#6b7480" text-anchor="middle">job ID · operator · machine ·</text>
    <text x="110" y="97" font-size="11" fill="#6b7480" text-anchor="middle">template · spectral data · timestamp</text>
  </g>
  <path d="M276 120 H 322" stroke="#2563eb" stroke-width="3" marker-end="url(#a2)"/>
  <!-- storage -->
  <g transform="translate(330,60)">
    <rect width="220" height="120" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="32" font-size="11" font-weight="700" letter-spacing="1.2" fill="#2563eb" text-anchor="middle">2 · STORAGE — YOUR NETWORK</text>
    <g transform="translate(80,46)"><ellipse cx="30" cy="8" rx="30" ry="9" fill="#eaf1fe" stroke="#2563eb"/><path d="M0 8 v34 a30 9 0 0 0 60 0 v-34" fill="#eaf1fe" stroke="#2563eb"/></g>
    <text x="110" y="112" font-size="11" fill="#6b7480" text-anchor="middle">SQL Server on premise — no vendor cloud</text>
  </g>
  <path d="M558 120 H 604" stroke="#2563eb" stroke-width="3" marker-end="url(#a2)"/>
  <!-- dashboards -->
  <g transform="translate(612,60)">
    <rect width="240" height="120" rx="14" fill="#fff" stroke="#e8ecf0" stroke-width="1.5"/>
    <text x="120" y="32" font-size="11" font-weight="700" letter-spacing="1.2" fill="#9aa3ae" text-anchor="middle">3 · REPORTS — DASHBOARDS</text>
    <g transform="translate(36,48)"><rect width="48" height="40" rx="6" fill="#f4f6f8"/><rect x="58" width="48" height="40" rx="6" fill="#f4f6f8"/><rect x="116" width="48" height="40" rx="6" fill="#f4f6f8"/><rect x="6" y="22" width="10" height="12" fill="#2563eb"/><rect x="20" y="14" width="10" height="20" fill="#00b3d6"/><rect x="64" y="10" width="36" height="6" rx="3" fill="#16a34a"/><rect x="64" y="22" width="26" height="6" rx="3" fill="#c8d0d9"/><path d="M122 30 l12 -12 l10 6 l14 -14" stroke="#e6007e" stroke-width="3" fill="none"/></g>
    <text x="120" y="112" font-size="11" fill="#6b7480" text-anchor="middle">per machine · per operator · per brand</text>
  </g>
  <!-- multi-site fork -->
  <g transform="translate(48,228)">
    <rect width="804" height="100" rx="14" fill="#f4f6f8"/>
    <text x="402" y="32" font-size="12" font-weight="700" fill="#111418" text-anchor="middle">Multi-site: decide at install — hard to change later</text>
    <g font-size="11.5" fill="#3c434b">
      <text x="210" y="62" text-anchor="middle"><tspan font-weight="700">Federated</tspan> — Reports queries each plant directly</text>
      <text x="210" y="80" text-anchor="middle">low latency · harder governance</text>
      <text x="594" y="62" text-anchor="middle"><tspan font-weight="700">Centralized</tspan> — nightly sync to one warehouse</text>
      <text x="594" y="80" text-anchor="middle">easy governance · one source of truth</text>
    </g>
    <line x1="402" y1="48" x2="402" y2="88" stroke="#c8d0d9" stroke-width="1.5"/>
  </g>
</svg>
